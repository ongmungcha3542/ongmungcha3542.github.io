<!DOCTYPE html>
<html lang="ko">
<head>
    <title>발롱도르 · AI 시상식</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Playfair+Display:ital,wght@0,500;0,800;1,500&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="./mltest_files/jquery-3.4.1.slim.min.js"></script>
    <script src="./mltest_files/tf.min.js"></script>
    <script src="./mltest_files/teachablemachine-image.min.js"></script>
    <style>
        :root {
            --gold-1: #fff3b0;
            --gold-2: #f6d365;
            --gold-3: #d4a017;
            --gold-4: #8a6410;
            --ink: #050505;
            --ink-2: #0d0d10;
            --gold-grad: linear-gradient(110deg, var(--gold-4) 0%, var(--gold-2) 22%, var(--gold-1) 40%, var(--gold-3) 58%, var(--gold-2) 80%, var(--gold-4) 100%);
            --serif: 'Cinzel', 'Playfair Display', 'Noto Serif KR', Georgia, serif;
            --kr: 'Noto Serif KR', 'Nanum Myeongjo', serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            background: radial-gradient(ellipse at 50% -10%, #2a2108 0%, #0a0804 45%, #000 100%) fixed;
            color: #f4e7bd;
            font-family: var(--kr);
            overflow-x: hidden;
            word-break: keep-all;
        }
        .gold-text {
            background: var(--gold-grad);
            background-size: 220% 100%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: shine 6s linear infinite;
        }
        @keyframes shine { to { background-position: -220% 0; } }

        /* ---------- 무대 배경 ---------- */
        #sparkles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .beams { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .beam {
            position: absolute; top: -10%; width: 28vw; height: 130vh; left: 50%;
            transform-origin: 50% 0;
            background: linear-gradient(to bottom, rgba(255,230,150,.30), rgba(255,230,150,0) 75%);
            clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
            filter: blur(6px);
            mix-blend-mode: screen;
        }
        .beam:nth-child(1) { margin-left: -14vw; animation: sweepA 9s ease-in-out infinite; }
        .beam:nth-child(2) { margin-left: -14vw; animation: sweepB 11s ease-in-out infinite; opacity: .8; }
        .beam:nth-child(3) { margin-left: -14vw; animation: sweepC 13s ease-in-out infinite; opacity: .6; }
        @keyframes sweepA { 0%,100% { transform: rotate(-38deg); } 50% { transform: rotate(-8deg); } }
        @keyframes sweepB { 0%,100% { transform: rotate(38deg); } 50% { transform: rotate(10deg); } }
        @keyframes sweepC { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(18deg); } }
        .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%); }

        .stage { position: relative; z-index: 2; max-width: 880px; margin: 0 auto; padding: 28px 18px 60px; }

        /* ---------- 헤더 ---------- */
        header { text-align: center; padding: 26px 0 10px; }
        .eyebrow { font-family: var(--serif); letter-spacing: .5em; font-size: .78rem; color: var(--gold-2); opacity: .85; }
        .trophy-wrap { margin: 14px auto 0; width: 130px; filter: drop-shadow(0 0 22px rgba(246,211,101,.55)); animation: float 4s ease-in-out infinite; }
        @keyframes float { 50% { transform: translateY(-8px); } }
        h1 { margin: 6px 0 0; font-family: var(--serif); font-weight: 900; line-height: 1; letter-spacing: .08em;
             font-size: clamp(2.4rem, 9vw, 4.6rem); text-transform: uppercase; }
        h1 small { display: block; font-size: .32em; letter-spacing: .6em; font-weight: 500; margin-top: 10px; }
        .divider { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 18px auto 6px; max-width: 420px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-3), transparent); }
        .divider i { width: 9px; height: 9px; background: var(--gold-2); transform: rotate(45deg); box-shadow: 0 0 12px var(--gold-2); }
        .sub { font-size: 1rem; color: #e8d89c; opacity: .9; margin: 6px 0 0; }

        /* ---------- 카드 공통 ---------- */
        .card-gold {
            position: relative; margin-top: 26px; padding: 30px 22px;
            background: linear-gradient(160deg, rgba(30,24,8,.88), rgba(8,7,4,.92));
            border-radius: 6px;
            border: 1px solid rgba(246,211,101,.45);
            box-shadow: 0 0 0 5px rgba(0,0,0,.6), 0 0 0 6px rgba(246,211,101,.22), 0 30px 80px rgba(0,0,0,.7), inset 0 0 60px rgba(246,211,101,.06);
        }
        .card-gold::before, .card-gold::after { content: '✦'; position: absolute; color: var(--gold-2); font-size: 1.1rem; text-shadow: 0 0 10px var(--gold-2); }
        .card-gold::before { top: 8px; left: 12px; }
        .card-gold::after  { bottom: 8px; right: 12px; }

        /* ---------- 업로드 (봉투) ---------- */
        .image-upload-wrap {
            position: relative; text-align: center; cursor: pointer;
            border: 2px dashed rgba(246,211,101,.55); border-radius: 6px;
            padding: 48px 16px; transition: .3s;
        }
        .image-upload-wrap:hover, .image-dropping { background: rgba(246,211,101,.08); border-color: var(--gold-1); box-shadow: 0 0 40px rgba(246,211,101,.25) inset; }
        .file-upload-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 3; }
        .envelope { width: 150px; margin: 0 auto 14px; filter: drop-shadow(0 0 18px rgba(246,211,101,.4)); transition: transform .4s; }
        .image-upload-wrap:hover .envelope { transform: translateY(-6px) rotate(-3deg) scale(1.05); }
        .upload-text { font-family: var(--serif); font-size: 1.15rem; letter-spacing: .08em; margin: 0; }
        .upload-sub { margin: 8px 0 0; font-size: .85rem; color: #cdbb7d; }

        .file-upload-content { display: none; text-align: center; }

        /* ---------- 사진 액자 ---------- */
        .frame-wrap { position: relative; display: inline-block; padding: 12px; background: var(--gold-grad); background-size: 200% 100%;
            box-shadow: 0 0 50px rgba(246,211,101,.4), 0 20px 50px rgba(0,0,0,.8); animation: shine 8s linear infinite; }
        .frame-wrap::after { content: ''; position: absolute; inset: 12px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.55); pointer-events: none; }
        .file-upload-image { display: block; max-width: min(100%, 360px); max-height: 380px; width: auto; height: auto; background: #000; }
        .frame-wrap.reveal-pop { animation: pop 1s cubic-bezier(.2,1.6,.4,1) both, shine 8s linear infinite; }
        @keyframes pop { from { transform: scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }

        /* ---------- 드럼롤 ---------- */
        #loading { display: none; margin-top: 26px; }
        .suspense { font-family: var(--serif); letter-spacing: .3em; font-size: .95rem; color: var(--gold-2); }
        .count { font-family: var(--serif); font-weight: 900; font-size: 5rem; line-height: 1.1; }
        .roll { height: 5px; margin: 14px auto 0; max-width: 360px; background: rgba(246,211,101,.15); overflow: hidden; border-radius: 3px; }
        .roll b { display: block; height: 100%; width: 0; background: var(--gold-grad); animation: fill 2.6s ease-in-out forwards; box-shadow: 0 0 14px var(--gold-2); }
        @keyframes fill { to { width: 100%; } }

        /* ---------- 우승자 ---------- */
        .result-message { margin-top: 24px; min-height: 0; }
        .winner-box { animation: rise 1s .1s cubic-bezier(.2,.9,.3,1.2) both; }
        @keyframes rise { from { transform: translateY(30px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
        .and { font-family: var(--serif); letter-spacing: .5em; font-size: .8rem; color: var(--gold-2); }
        .winner-name { font-family: var(--kr); font-weight: 900; font-size: clamp(2.8rem, 12vw, 5.4rem); line-height: 1.1; margin: 6px 0 4px; filter: drop-shadow(0 0 22px rgba(246,211,101,.55)); }
        .winner-explain { font-size: 1rem; color: #eadba4; max-width: 520px; margin: 8px auto 0; line-height: 1.7; }
        .medal { display: inline-block; margin-top: 10px; padding: 5px 16px; font-family: var(--serif); font-size: .8rem; letter-spacing: .3em;
                 color: #1a1204; background: var(--gold-grad); border-radius: 30px; font-weight: 700; box-shadow: 0 0 18px rgba(246,211,101,.6); }

        /* ---------- 순위 ---------- */
        .nominees-title { display: none; margin: 34px 0 6px; font-family: var(--serif); letter-spacing: .4em; font-size: .8rem; color: var(--gold-2); text-align: center; }
        #label-container { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; text-align: left; }
        .rank-row { display: grid; grid-template-columns: 38px 86px 1fr; align-items: center; gap: 10px; opacity: 0; animation: slidein .7s cubic-bezier(.2,.9,.3,1) forwards; }
        @keyframes slidein { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
        .rank-num { font-family: var(--serif); font-weight: 900; font-size: 1.6rem; text-align: center; }
        .rank-name { font-weight: 700; font-size: 1rem; }
        .bar-track { position: relative; height: 30px; background: rgba(255,255,255,.06); border: 1px solid rgba(246,211,101,.2); border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; transition: width 1.4s cubic-bezier(.2,.9,.2,1);
                    background: linear-gradient(90deg, #4a3a10, #8a6410); min-width: 54px; }
        .rank-row.first .bar-fill { background: var(--gold-grad); background-size: 200% 100%; animation: shine 4s linear infinite; box-shadow: 0 0 20px rgba(246,211,101,.6); }
        .rank-row.second .bar-fill { background: linear-gradient(90deg, #6b6f76, #d9dde3); }
        .rank-row.third .bar-fill { background: linear-gradient(90deg, #6a3d1c, #cd8a4d); }
        .percent-text { font-family: var(--serif); font-weight: 900; font-size: .85rem; color: #120d02; }
        .rank-row:not(.first) .percent-text { color: #0a0a0a; }

        /* ---------- 버튼 ---------- */
        .try-again-btn { margin-top: 34px; cursor: pointer; padding: 14px 34px; border: 0; border-radius: 40px;
            font-family: var(--serif); font-weight: 700; letter-spacing: .15em; font-size: .95rem; color: #1a1204;
            background: var(--gold-grad); background-size: 200% 100%; animation: shine 5s linear infinite;
            box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 0 3px var(--gold-2), 0 10px 30px rgba(246,211,101,.35); transition: transform .2s, box-shadow .2s; }
        .try-again-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 0 3px var(--gold-1), 0 14px 40px rgba(246,211,101,.6); }

        footer { text-align: center; margin-top: 46px; font-size: .78rem; color: #9c8c58; line-height: 1.8; }
        footer a { color: var(--gold-2); text-decoration: none; border-bottom: 1px dotted var(--gold-3); }
        #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        .flash { position: fixed; inset: 0; background: radial-gradient(circle, #fff7d0, transparent 70%); opacity: 0; pointer-events: none; z-index: 40; }
        .flash.go { animation: flash 1.1s ease-out; }
        @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

        @media (max-width: 520px) {
            .rank-row { grid-template-columns: 30px 64px 1fr; gap: 6px; }
            .card-gold { padding: 24px 14px; }
        }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
    </style>
</head>

<body>
    <canvas id="sparkles"></canvas>
    <div class="beams"><div class="beam"></div><div class="beam"></div><div class="beam"></div></div>
    <div class="vignette"></div>
    <div class="flash" id="flash"></div>
    <canvas id="confetti"></canvas>

    <main class="stage">
        <header>
            <div class="eyebrow">✦ THE 2026 CEREMONY ✦</div>
            <div class="trophy-wrap">
                <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#f6d365"/>
                            <stop offset=".75" stop-color="#d4a017"/><stop offset="1" stop-color="#8a6410"/>
                        </linearGradient>
                        <radialGradient id="b" cx=".35" cy=".3" r=".8">
                            <stop offset="0" stop-color="#fffbe0"/><stop offset=".35" stop-color="#f6d365"/><stop offset="1" stop-color="#7a5508"/>
                        </radialGradient>
                    </defs>
                    <!-- 공 -->
                    <circle cx="60" cy="42" r="34" fill="url(#b)"/>
                    <path d="M60 22 L74 32 L69 49 L51 49 L46 32 Z" fill="none" stroke="#7a5508" stroke-width="2.2" opacity=".75"/>
                    <path d="M60 22V10M74 32l12-5M69 49l9 11M51 49l-9 11M46 32l-12-5" stroke="#7a5508" stroke-width="2" opacity=".6" fill="none"/>
                    <!-- 받침 -->
                    <path d="M44 74 Q60 84 76 74 L72 100 Q60 108 48 100 Z" fill="url(#g)"/>
                    <rect x="50" y="98" width="20" height="14" fill="url(#g)"/>
                    <path d="M34 112 H86 L92 128 H28 Z" fill="url(#g)"/>
                    <rect x="22" y="128" width="76" height="14" rx="2" fill="url(#g)"/>
                    <rect x="38" y="132" width="44" height="6" rx="1" fill="#2a1d03" opacity=".75"/>
                </svg>
            </div>
            <h1 class="gold-text">Ballon d'Or<small>AI AWARDS</small></h1>
            <div class="divider"><i></i></div>
            <p class="sub">사진 한 장, 그리고 운명의 봉투 — 올해의 주인공을 AI가 발표합니다</p>
        </header>

        <section class="card-gold">
            <div class="file-upload">
                <div class="image-upload-wrap">
                    <input class="file-upload-input" type="file" onchange="readURL(this);" accept="image/*">
                    <svg class="envelope" viewBox="0 0 160 110" aria-hidden="true">
                        <rect x="4" y="14" width="152" height="92" rx="5" fill="#0b0904" stroke="url(#g)" stroke-width="3"/>
                        <path d="M4 18 L80 70 L156 18" fill="none" stroke="url(#g)" stroke-width="3"/>
                        <circle cx="80" cy="70" r="14" fill="url(#b)" stroke="#7a5508" stroke-width="2"/>
                        <text x="80" y="76" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#5a3f06">B</text>
                    </svg>
                    <h3 class="upload-text gold-text">봉투를 열어 후보를 올리세요</h3>
                    <p class="upload-sub">사진을 끌어놓거나 눌러서 업로드</p>
                </div>

                <div class="file-upload-content">
                    <div class="frame-wrap"><img class="file-upload-image" id="face-image" alt="your image"></div>

                    <div id="loading">
                        <div class="suspense">AND THE WINNER IS . . .</div>
                        <div class="count gold-text" id="count">3</div>
                        <div class="roll"><b></b></div>
                        <div class="sr-only" style="position:absolute;left:-9999px">AI가 사진을 분석중입니다.</div>
                    </div>

                    <div class="result-message"></div>
                    <div class="nominees-title">— NOMINEES RANKING —</div>
                    <div id="label-container"></div>

                    <button type="button" class="try-again-btn" onclick="gaReload()">다시 시상하기</button>
                </div>
            </div>
        </section>

        <footer>
            <p>© 수원대학교 빅데이터분석. All Rights Reserved.</p>
            <p><a href="https://www.youtube.com/channel/UCQNE2JmbasNYbjGAcuBiRRg">제작 도움: 조코딩 유튜브 채널</a></p>
        </footer>
    </main>

    <script>
        /* ===== 배경 반짝이 ===== */
        (function () {
            var c = document.getElementById('sparkles'), x = c.getContext('2d'), P = [], W, H;
            function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
            addEventListener('resize', size); size();
            for (var i = 0; i < 70; i++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + .4, s: Math.random() * .0004 + .00008, t: Math.random() * 6.28 });
            (function loop(t) {
                x.clearRect(0, 0, W, H);
                P.forEach(function (p) {
                    p.y -= p.s; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
                    var a = .35 + .65 * Math.abs(Math.sin(t / 700 + p.t));
                    x.beginPath(); x.arc(p.x * W, p.y * H, p.r, 0, 6.28);
                    x.fillStyle = 'rgba(255,225,130,' + a + ')'; x.shadowBlur = 10; x.shadowColor = '#f6d365'; x.fill();
                });
                requestAnimationFrame(loop);
            })(0);
        })();

        /* ===== 황금 폭죽 ===== */
        var confetti = (function () {
            var c = document.getElementById('confetti'), x = c.getContext('2d'), P = [], run = false, W, H;
            function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
            addEventListener('resize', size); size();
            var COL = ['#fff3b0', '#f6d365', '#d4a017', '#ffffff', '#c98a10'];
            function burst(cx, cy, n) {
                for (var i = 0; i < n; i++) {
                    var a = Math.random() * 6.28, v = Math.random() * 11 + 4;
                    P.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, w: Math.random() * 9 + 4, h: Math.random() * 5 + 3,
                             rot: Math.random() * 6, vr: (Math.random() - .5) * .4, col: COL[(Math.random() * COL.length) | 0], life: 1 });
                }
                if (!run) { run = true; requestAnimationFrame(tick); }
            }
            function rain(n) {
                for (var i = 0; i < n; i++) P.push({ x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 2, vy: Math.random() * 3 + 2,
                    w: Math.random() * 9 + 4, h: Math.random() * 5 + 3, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, col: COL[(Math.random() * COL.length) | 0], life: 1 });
                if (!run) { run = true; requestAnimationFrame(tick); }
            }
            function tick() {
                x.clearRect(0, 0, W, H);
                P = P.filter(function (p) { return p.life > 0 && p.y < H + 30; });
                P.forEach(function (p) {
                    p.vy += .22; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .004;
                    x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.globalAlpha = Math.max(p.life, 0);
                    x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
                });
                if (P.length) requestAnimationFrame(tick); else { run = false; x.clearRect(0, 0, W, H); }
            }
            return { burst: burst, rain: rain, celebrate: function () {
                $('#flash').removeClass('go'); void document.getElementById('flash').offsetWidth; $('#flash').addClass('go');
                burst(W * .2, H * .6, 110); burst(W * .8, H * .6, 110); burst(W * .5, H * .4, 160);
                setTimeout(function () { rain(140); }, 400);
                setTimeout(function () { burst(W * .35, H * .5, 90); burst(W * .65, H * .5, 90); }, 900);
            } };
        })();

        /* ===== 업로드 ===== */
        function gaReload() { window.location.reload(); }

        var analyzing = false;
        function readURL(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    $('.image-upload-wrap').hide();
                    $('#loading').show();
                    $('.file-upload-content').show();
                    var img = document.getElementById("face-image");
                    img.onload = function () {
                        img.onload = null;
                        runCeremony(img);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                removeUpload();
            }
        }

        function removeUpload() {
            $('.file-upload-input').replaceWith($('.file-upload-input').clone());
            $('.file-upload-content').hide();
            $('.image-upload-wrap').show();
        }
        $('.image-upload-wrap').bind('dragover', function () { $('.image-upload-wrap').addClass('image-dropping'); });
        $('.image-upload-wrap').bind('dragleave drop', function () { $('.image-upload-wrap').removeClass('image-dropping'); });

        /* 드럼롤 연출: 모델은 동시에 돌리고, 최소 ~2.6초는 뜸을 들인다 */
        function runCeremony(img) {
            var n = 3, el = document.getElementById('count');
            el.textContent = n;
            var tm = setInterval(function () { n--; if (n > 0) el.textContent = n; else { clearInterval(tm); el.textContent = '✦'; } }, 850);
            var wait = new Promise(function (r) { setTimeout(r, 2700); });
            var work = init().then(function () { return predict(); });
            Promise.all([work, wait]).then(function (res) {
                $('#loading').hide();
                show(res[0]);
            }).catch(function (err) {
                clearInterval(tm);
                console.error(err);
                $('#loading').hide();
                $('.result-message').text("분석 중 오류: " + err);
            });
        }
    </script>
    <script>
        let model, labelContainer, maxPredictions;
        const INFO = {
            '나연': 'JYP엔터테인먼트 소속 9인조 그룹 TWICE의 멤버',
            '장원영': '스타쉽엔터테인먼트 소속 6인조 걸그룹 IVE의 멤버.',
            '제니': 'YG엔터테인먼트 소속 4인조 걸그룹 BLACKPINK의 메인래퍼이자 리드보컬'
        };

        async function init() {
            const modelURL = "./mltest_files/model.json";
            const metadataURL = "./mltest_files/metadata.json";
            if (model) return;
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            labelContainer = document.getElementById("label-container");
        }

        async function predict() {
            var image = document.getElementById("face-image");
            const prediction = await model.predict(image, false);
            prediction.sort((a, b) => b.probability - a.probability);
            console.log(prediction[0].className);
            return prediction;
        }

        function esc(s) { return $('<div>').text(s).html(); }

        function show(prediction) {
            var top = prediction[0];
            var known = top.className in INFO;
            var name = known ? top.className : "알수없음";
            var explain = known ? INFO[top.className] : "";
            var pct = Math.round(top.probability * 100);

            $('.frame-wrap').addClass('reveal-pop');
            $('.result-message').html(
                "<div class='winner-box'>" +
                "<div class='and'>✦ THE WINNER IS ✦</div>" +
                "<div class='winner-name gold-text'>" + esc(name) + "</div>" +
                (explain ? "<div class='winner-explain'>" + esc(explain) + "</div>" : "") +
                "<div class='medal'>BALLON D'OR · " + pct + "%</div>" +
                "</div>");

            $('.nominees-title').show();
            var cls = ['first', 'second', 'third'], medal = ['1', '2', '3'];
            var html = '';
            for (let i = 0; i < maxPredictions; i++) {
                var p = prediction[i].probability;
                var w = Math.max(p * 100, 4);
                html += "<div class='rank-row " + (cls[i] || '') + "' style='animation-delay:" + (0.5 + i * 0.35) + "s'>" +
                    "<div class='rank-num gold-text'>" + (medal[i] || (i + 1)) + "</div>" +
                    "<div class='rank-name'>" + esc(prediction[i].className) + "</div>" +
                    "<div class='bar-track'><div class='bar-fill' data-w='" + w + "%'><span class='percent-text'>" + Math.round(p * 100) + "%</span></div></div>" +
                    "</div>";
            }
            labelContainer.innerHTML = html;
            setTimeout(function () { $('.bar-fill').each(function () { this.style.width = this.getAttribute('data-w'); }); }, 700);

            if (known) confetti.celebrate();
        }

        window.dataLayer = window.dataLayer || [];
    </script>
